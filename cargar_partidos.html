<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cargar fixture · La Bombonera</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;color:#1a1a2e;line-height:1.5}
  h1{color:#0a3d91;font-size:1.3rem}
  code{background:#eef2ff;padding:.1rem .3rem;border-radius:4px}
  button{background:#0a3d91;color:#fff;border:none;padding:.9rem 1.4rem;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem}
  button:disabled{opacity:.5;cursor:default}
  #log{margin-top:1.2rem;font-size:.95rem;white-space:pre-line;color:#374151}
  .ok{color:#0a7d3b;font-weight:600}
  .err{color:#c0341d;font-weight:600}
</style>
</head>
<body>
  <h1>⚽ Cargar fixture del Mundial 2026</h1>
  <p>Crea los 72 partidos de la fase de grupos en Firestore (documentos <code>partido_01</code> a <code>partido_72</code>). Puedes ejecutarlo más de una vez sin duplicar: usa IDs fijos, así que vuelve a escribir encima.</p>
  <button id="btn">Cargar 72 partidos</button>
  <div id="log"></div>

  <!-- Firebase Compat 10.12.2 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC7maKamaritBEEFzV_3-DC1JfKhIMuzAs",
      authDomain: "quiniela-bombonera-2026.firebaseapp.com",
      projectId: "quiniela-bombonera-2026",
      storageBucket: "quiniela-bombonera-2026.firebasestorage.app",
      messagingSenderId: "1079388852828",
      appId: "1:1079388852828:web:a202a5dcacaef837558c99",
      measurementId: "G-02D0DHPG52"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 12 grupos del Mundial 2026 (cabeza de serie primero)
    const grupos = {
      A: ["México", "Sudáfrica", "Corea del Sur", "República Checa"],
      B: ["Canadá", "Bosnia y Herzegovina", "Catar", "Suiza"],
      C: ["Brasil", "Marruecos", "Haití", "Escocia"],
      D: ["Estados Unidos", "Paraguay", "Australia", "Turquía"],
      E: ["Alemania", "Curazao", "Costa de Marfil", "Ecuador"],
      F: ["Países Bajos", "Japón", "Túnez", "Suecia"],
      G: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"],
      H: ["España", "Cabo Verde", "Arabia Saudita", "Uruguay"],
      I: ["Francia", "Senegal", "Irak", "Noruega"],
      J: ["Argentina", "Argelia", "Austria", "Jordania"],
      K: ["Portugal", "RD Congo", "Uzbekistán", "Colombia"],
      L: ["Inglaterra", "Croacia", "Ghana", "Panamá"]
    };

    // Genera los 6 enfrentamientos (todos contra todos) de cada grupo => 72 partidos
    function generarPartidos() {
      const lista = [];
      for (const [grupo, eq] of Object.entries(grupos)) {
        for (let i = 0; i < eq.length; i++) {
          for (let j = i + 1; j < eq.length; j++) {
            lista.push({ grupo, equipo_a: eq[i], equipo_b: eq[j] });
          }
        }
      }
      return lista;
    }

    async function cargar() {
      const btn = document.getElementById('btn');
      const log = document.getElementById('log');
      btn.disabled = true;
      log.textContent = 'Generando y cargando partidos...';

      const partidos = generarPartidos();
      try {
        const batch = db.batch();
        partidos.forEach((p, idx) => {
          const id_orden = idx + 1;
          const id = 'partido_' + String(id_orden).padStart(2, '0');
          const ref = db.collection('partidos_oficiales').doc(id);
          batch.set(ref, {
            fase: 'grupos',
            grupo: p.grupo,
            equipo_a: p.equipo_a,
            equipo_b: p.equipo_b,
            fecha: '',
            hora: '',
            estado: 'pendiente',
            resultado_real: null,
            id_orden
          });
        });
        await batch.commit();
        log.innerHTML = '<span class="ok">✅ Listo. Se cargaron ' + partidos.length +
          ' partidos.</span>\nVuelve a la app, recarga y verás los 72 partidos listos para pronosticar.';
      } catch (e) {
        log.innerHTML = '<span class="err">Error: ' + e.message + '</span>\nRevisa que las reglas de Firestore estén publicadas.';
        console.error(e);
        btn.disabled = false;
      }
    }

    document.getElementById('btn').addEventListener('click', cargar);
  </script>
</body>
</html>
